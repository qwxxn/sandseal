name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  cli-test:
    name: CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cli
      - name: Check
        working-directory: apps/cli
        run: cargo check --workspace
      - name: Test
        working-directory: apps/cli
        run: cargo test --workspace

  # A tag whose version does not match Cargo.toml would publish a binary that
  # reports a different version than the release it came from — and the
  # installer resolves versions from tags. Fail before spending four builds.
  version-check:
    name: Tag matches Cargo version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' apps/cli/Cargo.toml | cut -d'"' -f2)"
          echo "tag=${tag} cargo=${crate}"
          if [ "${tag}" != "${crate}" ]; then
            echo "::error::tag v${tag} does not match workspace version ${crate}"
            exit 1
          fi

  cli-release:
    name: Release Build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli-test, version-check]
    strategy:
      matrix:
        include:
          # Linux ships statically linked against musl. A gnu build takes the runner's glibc
          # as a floor — 24.04 means 2.39, so it refuses to start on Debian 12, Ubuntu 22.04,
          # RHEL 9 or anything else a year old, and never on Alpine. `cross` is what supplies
          # the musl toolchain for both arches.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: sandseal-linux-x86_64
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: sandseal-linux-aarch64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: sandseal-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: sandseal-darwin-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: matrix.cross
      - name: Build
        working-directory: apps/cli
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}
      - name: Check the Linux binary is static
        if: matrix.cross
        run: |
          out=$(file apps/cli/target/${{ matrix.target }}/release/sandseal)
          echo "$out"
          case "$out" in
            *"statically linked"*) ;;
            *) echo "::error::not a static binary — it would inherit a glibc floor from the runner"; exit 1 ;;
          esac
      - name: Package
        run: |
          mkdir -p dist
          cp apps/cli/target/${{ matrix.target }}/release/sandseal dist/sandseal
          cp -r apps/cli/agents dist/agents
          cp -r apps/cli/schema dist/schema
          cd dist && tar -czf ${{ matrix.artifact }}.tar.gz sandseal agents/ schema/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # install.sh refuses to install a binary it cannot verify, so SHA256SUMS is
      # a required asset, not a nicety.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
              dist/*.tar.gz dist/SHA256SUMS
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --generate-notes \
              dist/*.tar.gz dist/SHA256SUMS
          fi
